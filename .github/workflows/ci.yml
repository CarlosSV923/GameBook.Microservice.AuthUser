name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository workflow files
        shell: bash
        run: |
          set -euo pipefail
          test -f CONTRIBUTING.md
          test -f .github/pull_request_template.md
          test -f .github/workflows/ci.yml
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          AUTH_DATABASE_DIRECT_URL: postgresql://localhost:5432/gamebook
      - name: Run lint
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test
      - name: Run integration tests
        run: pnpm test:e2e
      - name: Build application
        run: pnpm build
