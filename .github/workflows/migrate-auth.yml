name: AuthUser database migrations

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/migrate-auth.yml
      - package.json
      - pnpm-lock.yaml
      - src/infrastructure/persistence/prisma/prisma.config.ts
      - src/infrastructure/persistence/prisma/schema.prisma
      - src/infrastructure/persistence/prisma/migrations/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate-auth-${{ github.ref_name }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }}
    env:
      AUTH_DATABASE_DIRECT_URL: ${{ secrets.AUTH_DATABASE_DIRECT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AUTH_DATABASE_DIRECT_URL:-}" ]]; then
            echo "::error::AUTH_DATABASE_DIRECT_URL is not configured in the selected GitHub environment."
            exit 1
          fi

          migration_user="$(node --input-type=module -e "const url = new URL(process.env.AUTH_DATABASE_DIRECT_URL); process.stdout.write(decodeURIComponent(url.username));")"
          if [[ "$migration_user" != "gamebook_auth_migrator_limited" ]]; then
            echo "::error::AUTH_DATABASE_DIRECT_URL must use gamebook_auth_migrator_limited."
            exit 1
          fi

          migration_schema="$(node --input-type=module -e "const url = new URL(process.env.AUTH_DATABASE_DIRECT_URL); process.stdout.write(url.searchParams.get('schema') ?? '');")"
          if [[ -n "$migration_schema" && "$migration_schema" != "auth" ]]; then
            echo "::error::AUTH_DATABASE_DIRECT_URL cannot target a schema other than auth."
            exit 1
          fi

          test -f src/infrastructure/persistence/prisma/migrations/migration_lock.toml
          test -n "$(find src/infrastructure/persistence/prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql -print -quit)"

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply AuthUser migrations
        run: pnpm db:migrate:deploy

      - name: Verify migration idempotence
        run: pnpm db:migrate:deploy
